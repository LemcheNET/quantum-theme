version = 1
SPDX-PackageName = "quantum-theme"
SPDX-PackageSupplier = "Valdemar Lemche <valdemar@lemche.net>"
SPDX-PackageDownloadLocation = "https://github.com/LemcheNET/quantum-theme"

# The Aurorae artwork is jomada's Moe, redistributed under its own licence with
# decoration.svg retinted. Separate copyright, separate holder.
[[annotations]]
path = ["variants/*/aurorae/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2021 jomada <gicalucejo@gmail.com>", "2026 Valdemar Lemche <valdemar@lemche.net>"]
SPDX-License-Identifier = "GPL-3.0-or-later"

# The Plasma style is original work whose assets inherit from Breeze.
[[annotations]]
path = ["variants/*/plasma/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Valdemar Lemche <valdemar@lemche.net>"
SPDX-License-Identifier = "LGPL-3.0-or-later"

# The GTK themes are generated by KDE's own breeze-gtk from this theme's scheme.
[[annotations]]
path = ["variants/*/gtk/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 Valdemar Lemche <valdemar@lemche.net>", "KDE breeze-gtk contributors"]
SPDX-License-Identifier = "LGPL-3.0-or-later"

# Preview images are generated, not screenshots. Replace with real ones before release.
[[annotations]]
path = ["variants/*/look-and-feel/*/contents/previews/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Valdemar Lemche <valdemar@lemche.net>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Everything else: the scripts, the look-and-feel packaging, the docs.
[[annotations]]
path = ["bin/**", "lib/**", "packaging/**", "tests/**", "variants/*/look-and-feel/*/metadata.json", "variants/*/look-and-feel/*/contents/defaults", "variants/*/variant.env", "*.sh", "*.md", "VERSION", ".gitignore", "REUSE.toml", ".github/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Valdemar Lemche <valdemar@lemche.net>"
SPDX-License-Identifier = "GPL-3.0-or-later"
